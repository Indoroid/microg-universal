name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g

jobs:
  microg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build microG
        working-directory: gmscore
        env: { GRADLE_MICROG_VERSION_WITHOUT_GIT: 1 }
        run: ./gradlew -I ../tools/central-mirror.gradle :play-services-core:assembleDefaultRelease :vending-app:assembleDefaultRelease -x lint -x lintVitalAnalyzeRelease --no-daemon
      - name: Unit tests
        working-directory: gmscore
        env: { GRADLE_MICROG_VERSION_WITHOUT_GIT: 1 }
        run: ./gradlew -I ../tools/central-mirror.gradle testDefaultReleaseUnitTest --continue --no-daemon
      - name: Sign for test installs
        run: |
          mkdir -p out
          tools/ci/sign.sh gmscore/play-services-core/build/outputs/apk/default/release/*.apk out/microg-ci.apk
          tools/ci/sign.sh gmscore/vending-app/build/outputs/apk/default/release/*.apk out/vending-ci.apk
      - uses: actions/upload-artifact@v4
        with: { name: microg, path: "out/*-ci.apk" }

  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: morphe-patcher from source
        run: tools/ci/morphe-patcher.sh
      - name: Contract copies in sync
        run: tools/e2e.sh check
      - name: Patch library
        working-directory: patches
        run: ./gradlew -I ../tools/no-github-packages.gradle :patch-library:jar --no-daemon
      - name: Harness, stub, test app
        run: |
          MORPHE_PATCHES_LIBRARY_JAR=$PWD/$(ls patches/patch-library/build/libs/morphe-patches-library-*[0-9].jar | head -1) gradle -p harness installDist --no-daemon
          gradle -p stub assembleRelease --no-daemon
          gradle -p testapp assembleRelease --no-daemon
      - name: Patch the test app (clone mode) and verify
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
          mkdir -p out/deps
          tools/e2e.sh patch testapp/app/build/outputs/apk/release/app-release.apk clone testapp
          mv out/real/testapp-microg.apk out/testapp-microg.apk
          tools/ci/sign.sh stub/app/build/outputs/apk/release/app-release*.apk out/gmscompat-stub-ci.apk
          cp patches/patch-library/build/libs/morphe-patches-library-*.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: patches
          path: |
            out/testapp-microg.apk
            out/gmscompat-stub-ci.apk
            out/morphe-patches-library-*.jar

  store:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: morphe-patcher from source
        run: tools/ci/morphe-patcher.sh
      - name: Patch library
        working-directory: patches
        run: ./gradlew -I ../tools/no-github-packages.gradle :patch-library:jar --no-daemon
      - name: Build store
        working-directory: store
        run: ./gradlew -I ../tools/central-mirror.gradle :app:assembleVanillaRelease :app:testVanillaDebugUnitTest --no-daemon
      - name: Sign for test installs
        run: |
          mkdir -p out
          tools/ci/sign.sh "$(ls store/app/build/outputs/apk/vanilla/release/*.apk | head -1)" out/store-ci.apk
      - uses: actions/upload-artifact@v4
        with: { name: store, path: out/store-ci.apk }

  emulator:
    needs: [microg, patches]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: tools/ci/emulator_smoke.sh art/microg-ci.apk art/vending-ci.apk art/gmscompat-stub-ci.apk art/testapp-microg.apk out/emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator, path: out/emulator }
